<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JDT Personal Site</title>

  <!-- 98.css CDN -->
  <link rel="stylesheet" href="https://unpkg.com/98.css">

  <style>
    body {
      background: teal;
      margin: 0;
      font-family: "MS Sans Serif", sans-serif;
    }

    .desktop {
      padding: 20px;
    }

    .icon {
      width: 80px;
      text-align: center;
      color: white;
      margin-bottom: 20px;
      cursor: pointer;
    }

    .window {
      width: 500px;
    }

    .window-body {
      font-size: 18px;
    }

    .taskbar {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: silver;
      border-top: 2px solid white;
      padding: 5px;
      display: flex;
      align-items: center;
    }

    .start-button {
      margin-right: 10px;
    }

    .title-bar {
      cursor: move;
      user-select: none;
    }
  </style>
</head>

<body>

  <!-- Desktop -->
  <div class="desktop">

    <div class="icon" onclick="openWindow('mainWindow')">
      💻
      <div>jdt.exe</div>
    </div>
    
    <div class="icon" onclick="openWindow('aboutWindow')">
      🖥️
      <div>About Me</div>
    </div>

    <div class="icon" onclick="openWindow('projectsWindow')">
      📁
      <div>Projects</div>
    </div>

    <!-- Main Window -->
    <div id="mainWindow" class="window" style="position:absolute; top:100px; left:150px; display:none;">
      <div class="title-bar draggable">
        <div class="title-bar-text">jdt.exe</div>
        <div class="title-bar-controls">
          <button aria-label="Minimize"></button>
          <button aria-label="Maximize"></button>
          <button aria-label="Close" onclick="closeWindow('mainWindow')"></button>
        </div>
      </div>

      <div class="window-body">
        <h3>Welcome</h3>
        <p>This is my cyber and policy portfolio and website!</p>

        <hr>

        <h4>About Me</h4>
        <ul>
          <li>Cybersecurity Policy</li>
          <li>AI and the Future</li>
          <li>Legislative Portfolio</li>
        </ul>

        <button>View Work</button>
      </div>
    </div>

  </div>

  <!-- Additional About Window -->
  <div id="aboutWindow" class="window" style="position:absolute; top:100px; left:150px; display:none;">
   <div class="title-bar draggable">
     <div class="title-bar-text">about.txt</div>
     <div class="title-bar-controls">
       <button aria-label="Minimize"></button>
       <button aria-label="Maximize"></button>
       <button aria-label="Close" onclick="closeWindow('aboutWindow')"></button>
     </div>
   </div>

   <div class="window-body">
     <h3>About Me</h3>
     <p>I’m a cyber policy student interested in legislation and national security.</p>
   </div>
  </div>


  <!-- Window Control Script-->
  <script>
  let zIndex = 1;

  function openWindow(id) {
    const win = document.getElementById(id);
    win.style.display = 'block';
    win.style.zIndex = zIndex++;
  }

  function closeWindow(id) {
    document.getElementById(id).style.display = 'none';
  }

  function makeDraggable() {
    const windows = document.querySelectorAll('.window');

    windows.forEach(win => {
        const titleBar = win.querySelector('.title-bar');

        let offsetX = 0;
        let offsetY = 0;
        let isDragging = false;

        titleBar.addEventListener('mousedown', (e) => {
        isDragging = true;
        offsetX = e.clientX - win.offsetLeft;
        offsetY = e.clientY - win.offsetTop;

        win.style.zIndex = zIndex++; // bring to front
        });

        document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;

        win.style.left = (e.clientX - offsetX) + 'px';
        win.style.top = (e.clientY - offsetY) + 'px';
        });

        document.addEventListener('mouseup', () => {
        isDragging = false;
        });
    });

  window.onload = function() {
    openWindow('mainWindow');
    makeDraggable();
  };
  }
  </script>

  <!-- Taskbar -->
  <div class="taskbar">
    <button class="start-button">Start</button>
    <span>jdtOS v1.0</span>
  </div>

</body>
</html>
